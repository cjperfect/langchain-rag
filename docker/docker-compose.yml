services:
  postgres:
    # 必须使用带 pgvector 的镜像：官方 postgres:17 不含 vector 扩展，
    # 会导致 PGVectorStore 初始化报 'extension "vector" is not available'
    image: pgvector/pgvector:pg17
    container_name: langchain-rag-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: chenjiang
      POSTGRES_DB: langchain_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
